name: custom_getchromsizes
description: Generates a FASTA file of chromosome sizes and a fasta index file
keywords:
  - fasta
  - chromosome
  - indexing
tools:
  - samtools:
      description: Tools for dealing with SAM, BAM and CRAM files
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      tool_dev_url: https://github.com/samtools/samtools
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: FASTA file
        pattern: "*.{fa,fasta,fna,fas}"
        ontologies: []
output:
  sizes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.sizes":
          type: file
          description: File containing chromosome lengths
          pattern: "*.{sizes}"
          ontologies: []
  fai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fai":
          type: file
          description: FASTA index file
          pattern: "*.{fai}"
          ontologies: []
  gzi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.gzi":
          type: file
          description: Optional gzip index file for compressed inputs
          pattern: "*.gzi"
          ontologies: []
  versions_samtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools --version 2>&1 | head -n1 | sed 's/samtools //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@tamara-hodgetts"
  - "@chris-cheshire"
  - "@muffato"
maintainers:
  - "@tamara-hodgetts"
  - "@chris-cheshire"
  - "@muffato"
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools --version 2>&1 | head -n1 | sed 's/samtools //'":
          type: eval
          description: The expression to obtain the version of the tool
